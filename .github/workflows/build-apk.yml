name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin .NET 9 SDK via global.json
        run: |
          SDK_VER=$(dotnet --list-sdks | grep '^9\.0\.' | tail -n 1 | awk '{print $1}')
          echo "Pinning SDK: $SDK_VER"
          printf '{"sdk":{"version":"%s","rollForward":"latestFeature"}}\n' "$SDK_VER" > global.json
          dotnet --version

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies (API 36)
        run: >
          dotnet build src/MiScaleExporter.MAUI/MiScaleExporter.MAUI.csproj
          -t:InstallAndroidDependencies
          -f net9.0-android36.0
          -p:AcceptAndroidSDKLicenses=True
          -p:CheckEolWorkloads=false

      - name: Generate signing keystore
        run: >
          keytool -genkeypair -v
          -keystore release.keystore
          -alias miscale
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass android -keypass android
          -dname "CN=MiScaleExporter, O=LocalBuild, C=PL"

      - name: Publish signed Release APK
        run: >
          dotnet publish src/MiScaleExporter.MAUI/MiScaleExporter.MAUI.csproj
          -f net9.0-android36.0
          -c Release
          -p:CheckEolWorkloads=false
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ github.workspace }}/release.keystore"
          -p:AndroidSigningKeyAlias=miscale
          -p:AndroidSigningKeyPass=android
          -p:AndroidSigningStorePass=android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiScaleExporter-Android-APK
          path: src/MiScaleExporter.MAUI/bin/Release/net9.0-android36.0/**/*-Signed.apk
          if-no-files-found: error
